name: PA-220 P5-2C host lifecycle validation

on:
  push:
    branches: [feature/pa220-ubootkit-web]
    paths:
      - '.github/workflows/pa220-p5-2c.yml'
      - 'u-boot/net/tcp.c'
      - 'u-boot/net/http_request.c'
      - 'u-boot/net/http_handler.c'
      - 'u-boot/include/net/**'
      - 'tests/host/http_lifecycle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Compile and run production TCP and HTTP lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          R=reports/pa220/P5-2C
          mkdir -p "$R"
          {
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "INTEGRATION_COMMIT=$(git rev-parse HEAD)"
            echo "CC=$(cc --version | head -n 1)"
            test -x tests/host/http_lifecycle/run.sh
            tests/host/http_lifecycle/run.sh
          } 2>&1 | tee "$R/10-host-tests.log"
      - name: Upload Host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa220-p5-2c-host-${{ github.sha }}
          path: reports/pa220/P5-2C/
          if-no-files-found: warn
          retention-days: 30
