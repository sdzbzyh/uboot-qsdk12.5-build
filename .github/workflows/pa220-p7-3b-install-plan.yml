name: PA-220 P7-3B manifest-gated install dry-run core
on:
  push:
    branches: [feature/pa220-ubootkit-web]
    paths:
      - 'u-boot/board/octeon/pa220/pa220_install_plan.c'
      - 'u-boot/include/pa220_install_plan.h'
      - 'tests/pa220/install-plan/**'
      - '.github/workflows/pa220-p7-3b-install-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  host-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Host strict and sanitizer tests
        run: |
          set -euo pipefail
          bash tests/pa220/install-plan/run.sh
      - name: Verify production target object
        env:
          GH_TOKEN: ${{ secrets.OCTEON_SDK_READ_TOKEN }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/sdk"; mkdir -p "$D"
          gh release download octeon-sdk-5.1.0 --repo sdzbzyh/pa220-toolchains --pattern '*.tar.gz' --pattern '*.sha256' --dir "$D"
          (cd "$D" && sha256sum -c ./*.sha256)
          mkdir "$RUNNER_TEMP/sdk-unpack"
          tar -xzf "$D"/*.tar.gz -C "$RUNNER_TEMP/sdk-unpack"
          GCC=$(find "$RUNNER_TEMP/sdk-unpack" -path '*/bin/mips64-octeon-linux-gnu-gcc' -print -quit)
          test -n "$GCC"
          TOOLCHAIN="$(dirname "$(dirname "$GCC")")"
          export OCTEON_MODEL=OCTEON_CN70XX
          export PA220_REPO_DIR="$RUNNER_TEMP/pa220-openwrt"
          export PA220_OUTPUT_DIR="$RUNNER_TEMP/pa220-output"
          ./build-pa220.sh "$TOOLCHAIN" 2>&1 | tee reports/pa220/P7-3/42-octeon-full-build.log
          ELF="$PA220_REPO_DIR/u-boot/u-boot-octeon_pa220"
          test -s "$ELF"
          "$TOOLCHAIN/bin/mips64-octeon-linux-gnu-readelf" -s "$ELF" | tee reports/pa220/P7-3/43-final-symbols.txt
          grep -q 'pa220_install_plan_build' reports/pa220/P7-3/43-final-symbols.txt
          grep -q 'pa220_install_dry_run_cmd' reports/pa220/P7-3/43-final-symbols.txt
          cp "$PA220_OUTPUT_DIR/u-boot-octeon_pa220.bin" reports/pa220/P7-3/u-boot-octeon_pa220.bin
          sha256sum "$ELF" reports/pa220/P7-3/u-boot-octeon_pa220.bin | tee reports/pa220/P7-3/44-build-sha256.txt
          echo P7_3B_OCTEON_FULL_UBOOT_LINK=PASS
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa220-p7-3b-install-plan-${{ github.sha }}
          path: reports/pa220/P7-3/
          if-no-files-found: warn
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:"pa220/p7-3b-install-plan",description:"P7-3B "+process.env.JOB_STATUS,target_url:"https://github.com/"+context.repo.owner+"/"+context.repo.repo+"/actions/runs/"+context.runId});
