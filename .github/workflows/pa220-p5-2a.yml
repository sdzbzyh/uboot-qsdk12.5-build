name: PA-220 P5-2A bounded HTTP request parser
on:
  push:
    branches: [feature/pa220-ubootkit-web]
    paths:
      - '.github/workflows/pa220-p5-2a.yml'
      - 'u-boot/net/http_request.c'
      - 'u-boot/include/net/http_request.h'
      - 'tests/host/http_request/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host-and-octeon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/pa220-ubootkit-web
          fetch-depth: 0
      - name: Host regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/pa220/P5-2A
          chmod +x tests/host/http_request/run.sh
          { echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "COMMIT=$(git rev-parse HEAD)"; cc --version | head -n 1; tests/host/http_request/run.sh; } 2>&1 | tee reports/pa220/P5-2A/10-host-tests.log
      - name: OCTEON target object compile and relocatable link
        env:
          GH_TOKEN: ${{ secrets.OCTEON_SDK_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          R=reports/pa220/P5-2A
          mkdir -p "$R" "$RUNNER_TEMP/octeon-download" "$RUNNER_TEMP/octeon-sdk"
          {
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "INTEGRATION_COMMIT=$(git rev-parse HEAD)"
            echo "PA220_SOURCE_PIN=801717ba6a8a59ed2cfd53bf3e1b19841fecd2e8"
            sha256sum u-boot/net/http_request.c u-boot/include/net/http_request.h
            test -n "$GH_TOKEN"
            gh release download octeon-sdk-5.1.0 --repo sdzbzyh/pa220-toolchains --pattern '*.tar.gz' --pattern '*.sha256' --dir "$RUNNER_TEMP/octeon-download"
            (cd "$RUNNER_TEMP/octeon-download" && sha256sum -c ./*.sha256)
            A=$(find "$RUNNER_TEMP/octeon-download" -maxdepth 1 -name '*.tar.gz' -print -quit)
            tar -xzf "$A" -C "$RUNNER_TEMP/octeon-sdk"
            GCC=$(find "$RUNNER_TEMP/octeon-sdk" -path '*/bin/mips64-octeon-linux-gnu-gcc' -print -quit)
            test -n "$GCC"
            TC=$(dirname "$(dirname "$GCC")")
            export PATH="$TC/bin:$PATH" OCTEON_MODEL=OCTEON_CN70XX
            "$GCC" --version | head -n 2
            echo "TARGET=$("$GCC" -dumpmachine)"
            git clone --no-checkout https://github.com/IronDemiGod/pa220-openwrt.git "$RUNNER_TEMP/pa220-source"
            git -C "$RUNNER_TEMP/pa220-source" checkout --detach 801717ba6a8a59ed2cfd53bf3e1b19841fecd2e8
            test "$(git -C "$RUNNER_TEMP/pa220-source" rev-parse HEAD)" = 801717ba6a8a59ed2cfd53bf3e1b19841fecd2e8
            U="$RUNNER_TEMP/pa220-source/u-boot"
            cp u-boot/net/http_request.c "$U/net/http_request.c"
            mkdir -p "$U/include/net"
            cp u-boot/include/net/http_request.h "$U/include/net/http_request.h"
            make -C "$U" octeon_pa220_config HOSTCC="$U/tools/hostcc-gnu89"
            make -C "$U" V=1 include/generated/generic-asm-offsets.h include/generated/asm-offsets.h HOSTCC="$U/tools/hostcc-gnu89"
            make -C "$U" V=1 net/http_request.o HOSTCC="$U/tools/hostcc-gnu89"
            test -s "$U/net/http_request.o"
            file "$U/net/http_request.o"
            "$TC/bin/mips64-octeon-linux-gnu-readelf" -h "$U/net/http_request.o" | tee "$R/21-parser-object-elf-header.txt"
            "$TC/bin/mips64-octeon-linux-gnu-nm" -u "$U/net/http_request.o" | tee "$R/22-parser-object-undefined-symbols.txt"
            "$GCC" -mabi=n32 -mabicalls -msoft-float -G 0 -nostdlib -Wl,-r "$U/net/http_request.o" -o "$R/http_request-linked.o"
            "$TC/bin/mips64-octeon-linux-gnu-readelf" -h "$R/http_request-linked.o" | tee "$R/25-linked-object-elf-header.txt"
            printf '%s\n' '#include <common.h>' '#include <net/http_request.h>' 'char pa220_http_request_parser_size[sizeof(struct http_request_parser)];' > "$U/net/http_request_size.c"
            make -C "$U" V=1 net/http_request_size.o HOSTCC="$U/tools/hostcc-gnu89"
            "$TC/bin/mips64-octeon-linux-gnu-nm" -S "$U/net/http_request_size.o" | tee "$R/27-parser-static-size.txt"
            sha256sum "$R/http_request-linked.o" | tee "$R/26-linked-object-sha256.txt"
            wc -c "$U/net/http_request.o" | tee "$R/23-parser-object-size.txt"
            sha256sum "$U/net/http_request.o" | tee "$R/24-parser-object-sha256.txt"
            cp "$U/net/http_request.o" "$R/http_request.o"
            echo TARGET_COMPILE_AND_RELOCATABLE_LINK=PASS
          } 2>&1 | tee "$R/20-octeon-target-compile.log"
      - name: Archive design and matrix
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          R=reports/pa220/P5-2A
          cat > "$R/30-test-matrix.md" <<'EOF'
          # P5-2A Host regression matrix
          | # | Case | Expected | Actual | Result |
          |---:|---|---|---|---|
          | 01 | Complete GET | COMPLETE, GET /, 1 header | COMPLETE, GET /, 1 header | PASS |
          | 02 | Complete HEAD | COMPLETE, HEAD /status | COMPLETE, HEAD /status | PASS |
          | 03 | Request-line split | NEED_MORE until final chunk | NEED_MORE then COMPLETE | PASS |
          | 04 | URI split | NEED_MORE until final chunk | NEED_MORE then COMPLETE | PASS |
          | 05 | Header split | NEED_MORE then 1 parsed header | NEED_MORE then COMPLETE, header_count=1 | PASS |
          | 06 | CRLF split | NEED_MORE then COMPLETE | NEED_MORE then COMPLETE | PASS |
          | 07 | Multiple headers | COMPLETE, header_count=3 | COMPLETE, header_count=3 | PASS |
          | 08 | Header name case-insensitive | COMPLETE, CL zero accepted | COMPLETE, CL zero accepted | PASS |
          | 09 | Request line overlong | ERROR / request-line-limit | ERROR / request-line-limit | PASS |
          | 10 | URI overlong | ERROR / bad-uri | ERROR / bad-uri | PASS |
          | 11 | Header count over limit | ERROR / header-count-limit | ERROR / header-count-limit | PASS |
          | 12 | Header line over limit | ERROR / header-line-limit | ERROR / header-line-limit | PASS |
          | 13 | Header total over limit | ERROR / header-total-limit | ERROR / header-total-limit | PASS |
          | 14 | RX buffer overflow | ERROR / rx-limit | ERROR / rx-limit | PASS |
          | 15 | NUL byte | ERROR / bad-header | ERROR / bad-header | PASS |
          | 16 | Bare LF | ERROR / bad-crlf | ERROR / bad-crlf | PASS |
          | 17 | Invalid request-line spacing | ERROR / bad-request-line | ERROR / bad-request-line | PASS |
          | 18 | Header missing colon | ERROR / bad-header | ERROR / bad-header | PASS |
          | 19 | Invalid Content-Length | ERROR / bad-content-length | ERROR / bad-content-length | PASS |
          | 20 | Duplicate Content-Length | ERROR / duplicate-content-length | ERROR / duplicate-content-length | PASS |
          | 21 | Conflicting duplicate Content-Length | ERROR / duplicate-content-length | ERROR / duplicate-content-length | PASS |
          | 22 | Content-Length + Transfer-Encoding | ERROR / content-length-transfer-encoding | ERROR / content-length-transfer-encoding | PASS |
          | 23 | Transfer-Encoding before Content-Length | ERROR / content-length-transfer-encoding | ERROR / content-length-transfer-encoding | PASS |
          | 24 | Unsupported Transfer-Encoding | ERROR / transfer-encoding-not-supported | ERROR / transfer-encoding-not-supported | PASS |
          | 25 | Content-Length decimal overflow | ERROR / bad-content-length | ERROR / bad-content-length | PASS |
          | 26 | Control byte in header value | ERROR / bad-header-value | ERROR / bad-header-value | PASS |
          | 27 | Nonzero request body | ERROR / body-not-supported | ERROR / body-not-supported | PASS |
          | 28 | Incomplete request | NEED_MORE | NEED_MORE | PASS |
          | 29 | Trailing body bytes | ERROR / body-too-large | ERROR / body-too-large | PASS |
          | 30 | Reset then independent request | COMPLETE, HEAD | COMPLETE, HEAD | PASS |
          | 31 | Repeated COMPLETE | COMPLETE, stable | COMPLETE, stable | PASS |
          | 32 | Header terminator split | NEED_MORE then COMPLETE, count=1 | NEED_MORE then COMPLETE, count=1 | PASS |
          | 33 | CR followed by non-LF | ERROR / bad-crlf | ERROR / bad-crlf | PASS |
          | 34 | Malformed percent escape in URI | ERROR / bad-uri | ERROR / bad-uri | PASS |
          | 35 | Backslash in URI | ERROR / bad-uri | ERROR / bad-uri | PASS |
          EOF
          cat > "$R/31-design.md" <<'EOF'
          # PA-220 P5-2A parser design
          Standalone C parser, one fixed RX buffer, one HTTP/1.x request head, no dynamic allocation, I/O, TCP calls, URI dispatch, or body support. Each TCP-read chunk is appended once; parse_offset records the first unparsed header byte so accepted headers are never counted twice. Incomplete bytes remain parser-owned because tcp_core_read consumes its RX queue. A completed request remains stable until explicit reset.
          | Resource | Limit |
          |---|---:|
          | RX buffer | 4096 bytes |
          | TX planning limit (not allocated here) | 1460 bytes |
          | Request line excluding CRLF | 512 bytes |
          | URI | 384 bytes |
          | Header count | 16 |
          | Header line including CRLF | 256 bytes |
          | Aggregate header section including CRLF | 2048 bytes |
          | Request body | 0 bytes |
          Strict grammar: exactly one SP separates METHOD, request-target and VERSION; METHOD/header names use token characters; only HTTP/1.0 and HTTP/1.1 are accepted. URI accepts RFC 3986 ASCII characters and valid percent triplets, rejects fragments, controls, malformed escapes and backslash. CRLF is mandatory. Header names are case-insensitive; obs-fold and malformed/control-bearing values are rejected.
          Content-Length uses checked decimal parsing; one zero value is accepted, duplicates are rejected, nonzero is rejected. Transfer-Encoding is unsupported and CL/TE conflicts are rejected in either order. Bytes following CRLFCRLF are rejected. NEED_MORE is a viable incomplete prefix; COMPLETE occurs only at CRLFCRLF; ERROR is sticky until reset.
          Measured sizeof(struct http_request_parser): 13224 bytes on Host and OCTEON N32 target. This includes the 4096-byte RX buffer and structured header storage. TX capacity is a compile-time limit only and is not allocated in this parser.
          P5-2A does not alter TCP, foreground web lifecycle, patch series, or URI routing. The target workflow compiles the parser object against the exact pinned PA-220 source and performs a matching N32 relocatable link.
          EOF
          cat > "$R/32-execution-summary.md" <<'EOF'
          # P5-2A execution summary
          - Host regression: 35 cases, 95 assertions, zero failures; see 10-host-tests.log and 30-test-matrix.md.
          - Host parser structure size: 13224 bytes.
          - OCTEON SDK: octeon-sdk-5.1.0, Cavium GCC 4.7.0, target triple mips64-octeon-linux-gnu.
          - Configured object ABI: ELF32, big-endian, MIPS N32 ABI2, OCTEON / MIPS64r2; see 21-parser-object-elf-header.txt.
          - Target parser object: 25172 bytes; SHA-256 c982e9ae1441dbd16392912a88ea3e983c6929221a0cbe9a34e766d46911fa0b.
          - Undefined references: memcmp, memcpy, memset only; all are U-Boot memory/string primitives, with no malloc/free or other libc dependency.
          - Relocatable target link: PASS; see 25-linked-object-elf-header.txt and 26-linked-object-sha256.txt.
          - Target parser structure size: 0x33a8 = 13224 bytes; see 27-parser-static-size.txt.
          - Target source baseline: IronDemiGod/pa220-openwrt@801717ba6a8a59ed2cfd53bf3e1b19841fecd2e8.
          - Scope: standalone P5-2A parser only. No TCP or pa220 web lifecycle changes; no P5-2B URI handler.
          EOF
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pa220-p5-2a-http-request-parser
          path: reports/pa220/P5-2A/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pa220/P5-2A/
          if ! git diff --cached --quiet; then
            git commit -m "pa220: archive P5-2A HTTP parser validation"
            git fetch origin feature/pa220-ubootkit-web
            git rebase origin/feature/pa220-ubootkit-web
            git push origin HEAD:refs/heads/feature/pa220-ubootkit-web
          fi
