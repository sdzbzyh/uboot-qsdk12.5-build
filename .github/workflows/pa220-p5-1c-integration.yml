name: PA-220 P5-1C foreground lifecycle integration

on:
  push:
    branches:
      - feature/pa220-ubootkit-web
    paths:
      - '.github/workflows/pa220-p5-1c-integration.yml'
      - 'patches/pa220/0004-pa220-foreground-web-lifecycle.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrated-build:
    name: Build and verify P5-1C foreground lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/pa220-ubootkit-web
          fetch-depth: 0

      - name: Apply pinned patch series once and build PA-220
        id: build
        env:
          GH_TOKEN: ${{ secrets.OCTEON_SDK_READ_TOKEN }}
        shell: bash
        run: |
          set +e
          REPORT_DIR="reports/pa220/P5-1C"
          mkdir -p "$REPORT_DIR" external
          LOG="$REPORT_DIR/10-octeon-integrated-build.log"
          SUMMARY="$REPORT_DIR/10-octeon-integrated-build.md"
          DOWNLOAD_RC=99
          CHECKSUM_RC=99
          SOURCE_RC=99
          PATCH_RC=99
          BUILD_RC=99
          OBJECT_RC=99
          LINK_RC=99
          TOOLCHAIN_DIR=""
          PA220_REPO_DIR="$GITHUB_WORKSPACE/external/pa220-openwrt"
          UBOOT_DIR="$PA220_REPO_DIR/u-boot"

          {
            echo "========== PA-220 P5-1C INTEGRATED BUILD =========="
            date -u '+UTC_DATE=%Y-%m-%dT%H:%M:%SZ'
            echo "INTEGRATION_COMMIT=$(git rev-parse HEAD)"
            echo "PA220_SOURCE_COMMIT=801717ba6a8a59ed2cfd53bf3e1b19841fecd2e8"
            echo
            echo "========== PATCH SOURCE =========="
            sha256sum patches/pa220/0004-pa220-foreground-web-lifecycle.patch
            echo
            echo "========== PRIVATE OCTEON SDK RELEASE =========="
            mkdir -p "$RUNNER_TEMP/octeon-download" "$RUNNER_TEMP/octeon-sdk"
            if [ -z "$GH_TOKEN" ]; then
              echo "ERROR: OCTEON_SDK_READ_TOKEN unavailable"
            else
              gh release download octeon-sdk-5.1.0 --repo sdzbzyh/pa220-toolchains \
                --pattern '*.tar.gz' --pattern '*.sha256' --dir "$RUNNER_TEMP/octeon-download"
              DOWNLOAD_RC=$?
            fi
            echo "DOWNLOAD_RC=$DOWNLOAD_RC"
            if [ "$DOWNLOAD_RC" -eq 0 ]; then
              (cd "$RUNNER_TEMP/octeon-download" && sha256sum -c ./*.sha256)
              CHECKSUM_RC=$?
            fi
            echo "CHECKSUM_RC=$CHECKSUM_RC"
            if [ "$DOWNLOAD_RC" -eq 0 ] && [ "$CHECKSUM_RC" -eq 0 ]; then
              ARCHIVE=$(find "$RUNNER_TEMP/octeon-download" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
              tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/octeon-sdk"
              EXTRACT_RC=$?
            else
              EXTRACT_RC=99
            fi
            echo "EXTRACT_RC=$EXTRACT_RC"
            if [ "$EXTRACT_RC" -eq 0 ]; then
              GCC_PATH=$(find "$RUNNER_TEMP/octeon-sdk" -path '*/bin/mips64-octeon-linux-gnu-gcc' -print -quit)
            else
              GCC_PATH=""
            fi
            if [ -n "$GCC_PATH" ]; then
              TOOLCHAIN_DIR=$(dirname "$(dirname "$GCC_PATH")")
              export PATH="$TOOLCHAIN_DIR/bin:$PATH"
              export OCTEON_MODEL=OCTEON_CN70XX
              "$GCC_PATH" --version | head -n 2
              echo "TARGET=$("$GCC_PATH" -dumpmachine)"
            else
              echo "ERROR: OCTEON GCC missing from SDK"
              DOWNLOAD_RC=97
            fi

            if [ -n "$TOOLCHAIN_DIR" ]; then
              echo
              echo "========== BUILD SCRIPT OWNS PATCH APPLICATION =========="
              PA220_REPO_DIR="$PA220_REPO_DIR" ./build-pa220.sh "$TOOLCHAIN_DIR" \
                > "$RUNNER_TEMP/pa220-build-output.log" 2>&1
              BUILD_RC=$?
              cat "$RUNNER_TEMP/pa220-build-output.log"
              ACTUAL_SOURCE=$(git -C "$PA220_REPO_DIR" rev-parse HEAD 2>/dev/null)
              echo "ACTUAL_SOURCE=$ACTUAL_SOURCE"
              if [ "$ACTUAL_SOURCE" = "801717ba6a8a59ed2cfd53bf3e1b19841fecd2e8" ]; then
                SOURCE_RC=0
              fi
              if grep -F "Applied PA-220 patch: 0004-pa220-foreground-web-lifecycle.patch" "$RUNNER_TEMP/pa220-build-output.log" >/dev/null ||
                 grep -F "PA-220 patch already applied: 0004-pa220-foreground-web-lifecycle.patch" "$RUNNER_TEMP/pa220-build-output.log" >/dev/null; then
                PATCH_RC=0
              else
                PATCH_RC=1
              fi
            fi
            echo "SOURCE_RC=$SOURCE_RC PATCH_RC=$PATCH_RC BUILD_RC=$BUILD_RC"

            if [ "$BUILD_RC" -eq 0 ]; then
              echo
              echo "========== PA-220 COMMAND OBJECT =========="
              test -s "$UBOOT_DIR/common/cmd_pa220_web.o"
              CMD_OBJECT_RC=$?
              "$TOOLCHAIN_DIR/bin/mips64-octeon-linux-gnu-readelf" -h \
                "$UBOOT_DIR/common/cmd_pa220_web.o" > "$REPORT_DIR/11-web-command-object-elf-header.txt"
              OBJECT_ELF_RC=$?
              echo "CMD_OBJECT_RC=$CMD_OBJECT_RC OBJECT_ELF_RC=$OBJECT_ELF_RC"
              if [ "$CMD_OBJECT_RC" -eq 0 ] && [ "$OBJECT_ELF_RC" -eq 0 ]; then
                OBJECT_RC=0
              else
                OBJECT_RC=1
              fi
              echo
              echo "========== FINAL ELF, MAP AND SYMBOLS =========="
              ELF="$UBOOT_DIR/u-boot-octeon_pa220"
              MAP="$UBOOT_DIR/u-boot-octeon_pa220.map"
              SYSTEM_MAP="$UBOOT_DIR/System-octeon_pa220.map"
              test -s "$ELF"; ELF_RC=$?
              test -s "$MAP"; MAP_RC=$?
              test -s "$SYSTEM_MAP"; SYSTEM_MAP_RC=$?
              echo "ELF_RC=$ELF_RC MAP_RC=$MAP_RC SYSTEM_MAP_RC=$SYSTEM_MAP_RC"
              if [ "$ELF_RC" -eq 0 ] && [ "$MAP_RC" -eq 0 ] && [ "$SYSTEM_MAP_RC" -eq 0 ]; then
                file "$ELF"
                "$TOOLCHAIN_DIR/bin/mips64-octeon-linux-gnu-readelf" -h "$ELF" > "$REPORT_DIR/12-final-elf-header.txt"
                "$TOOLCHAIN_DIR/bin/mips64-octeon-linux-gnu-nm" -n "$ELF" > "$REPORT_DIR/13-final-elf-symbols.txt"
                grep -E 'cmd_pa220_web\.o|do_pa220_web|tcp_core_input|tcp_core_poll|net_set_tcp_handler' "$MAP" > "$REPORT_DIR/14-p5-1c-link-map-extract.txt"
                MAP_GREP_RC=$?
                grep -E 'do_pa220_web|tcp_core_input|tcp_core_poll|net_set_tcp_handler' "$REPORT_DIR/13-final-elf-symbols.txt" > "$REPORT_DIR/15-p5-1c-final-elf-symbols.txt"
                ELF_GREP_RC=$?
                grep -E 'do_pa220_web|tcp_core_input|tcp_core_poll|net_set_tcp_handler' "$SYSTEM_MAP" > "$REPORT_DIR/16-p5-1c-system-map-extract.txt"
                SYSTEM_GREP_RC=$?
                for symbol in do_pa220_web tcp_core_input tcp_core_poll net_set_tcp_handler; do
                  grep -E " [Tt] $symbol$" "$REPORT_DIR/13-final-elf-symbols.txt" >/dev/null
                  SYMBOL_RC=$?
                  echo "FINAL_ELF_SYMBOL_$symbol=$SYMBOL_RC"
                  if [ "$SYMBOL_RC" -ne 0 ]; then LINK_RC=1; fi
                done
                if [ "$MAP_GREP_RC" -ne 0 ] || [ "$ELF_GREP_RC" -ne 0 ] || [ "$SYSTEM_GREP_RC" -ne 0 ]; then LINK_RC=1; fi
                if [ "$LINK_RC" -ne 1 ]; then LINK_RC=0; fi
                sha256sum "$UBOOT_DIR/common/cmd_pa220_web.o" "$ELF" "$MAP" "$SYSTEM_MAP" "$UBOOT_DIR/u-boot-octeon_pa220.bin"
              else
                LINK_RC=1
              fi
              echo "OBJECT_RC=$OBJECT_RC LINK_RC=$LINK_RC"
            fi

            echo
            echo "========== FINAL STATUS =========="
            echo "DOWNLOAD_RC=$DOWNLOAD_RC CHECKSUM_RC=$CHECKSUM_RC SOURCE_RC=$SOURCE_RC"
            echo "PATCH_RC=$PATCH_RC BUILD_RC=$BUILD_RC OBJECT_RC=$OBJECT_RC LINK_RC=$LINK_RC"
            echo "========== END =========="
          } > "$LOG" 2>&1

          cat "$LOG"
          cat > "$SUMMARY" <<EOF
          # PA-220 P5-1C integrated OCTEON build

          - Integration commit: $(git rev-parse HEAD)
          - PA-220 source: 801717ba6a8a59ed2cfd53bf3e1b19841fecd2e8
          - SDK: octeon-sdk-5.1.0 / Cavium GCC 4.7.0 / SDK Build 52
          - SDK download/checksum: $DOWNLOAD_RC / $CHECKSUM_RC
          - Exact source checkout: $SOURCE_RC
          - Patch application through build-pa220.sh: $PATCH_RC
          - Full PA-220 build: $BUILD_RC
          - Command object verification: $OBJECT_RC
          - Final U-Boot ELF/map/System.map verification: $LINK_RC

          Full log: [10-octeon-integrated-build.log](10-octeon-integrated-build.log)
          EOF
          echo "download_rc=$DOWNLOAD_RC" >> "$GITHUB_OUTPUT"
          echo "checksum_rc=$CHECKSUM_RC" >> "$GITHUB_OUTPUT"
          echo "source_rc=$SOURCE_RC" >> "$GITHUB_OUTPUT"
          echo "patch_rc=$PATCH_RC" >> "$GITHUB_OUTPUT"
          echo "build_rc=$BUILD_RC" >> "$GITHUB_OUTPUT"
          echo "object_rc=$OBJECT_RC" >> "$GITHUB_OUTPUT"
          echo "link_rc=$LINK_RC" >> "$GITHUB_OUTPUT"

      - name: Upload P5-1C build evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pa220-p5-1c-foreground-web-lifecycle
          path: |
            reports/pa220/P5-1C/
            external/pa220-openwrt/u-boot/common/cmd_pa220_web.o
            external/pa220-openwrt/u-boot/u-boot-octeon_pa220
            external/pa220-openwrt/u-boot/u-boot-octeon_pa220.map
            external/pa220-openwrt/u-boot/System-octeon_pa220.map
            external/pa220-openwrt/u-boot/u-boot-octeon_pa220.bin
            bin/pa220/u-boot-octeon_pa220.bin
          if-no-files-found: warn
          retention-days: 30

      - name: Commit P5-1C evidence
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+sdzbzyh@users.noreply.github.com"
          git add reports/pa220/P5-1C/
          git diff --cached --quiet
          if [ "$?" -eq 0 ]; then
            echo "No P5-1C evidence to commit."
            exit 0
          fi
          git commit -m "pa220: record P5-1C OCTEON build evidence"
          if [ "$?" -ne 0 ]; then exit 1; fi
          PUSHED=0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:refs/heads/feature/pa220-ubootkit-web; then
              PUSHED=1
              break
            fi
            git fetch origin feature/pa220-ubootkit-web
            git rebase origin/feature/pa220-ubootkit-web
            if [ "$?" -ne 0 ]; then
              echo "Rebase failed; P5-1C evidence commit is preserved."
              exit 1
            fi
          done
          [ "$PUSHED" -eq 1 ]

      - name: Enforce build and final link acceptance
        if: always()
        env:
          DOWNLOAD_RC: ${{ steps.build.outputs.download_rc }}
          CHECKSUM_RC: ${{ steps.build.outputs.checksum_rc }}
          SOURCE_RC: ${{ steps.build.outputs.source_rc }}
          PATCH_RC: ${{ steps.build.outputs.patch_rc }}
          BUILD_RC: ${{ steps.build.outputs.build_rc }}
          OBJECT_RC: ${{ steps.build.outputs.object_rc }}
          LINK_RC: ${{ steps.build.outputs.link_rc }}
        shell: bash
        run: |
          if [ "$DOWNLOAD_RC" != "0" ] ||
             [ "$CHECKSUM_RC" != "0" ] ||
             [ "$SOURCE_RC" != "0" ] ||
             [ "$PATCH_RC" != "0" ] ||
             [ "$BUILD_RC" != "0" ] ||
             [ "$OBJECT_RC" != "0" ] ||
             [ "$LINK_RC" != "0" ]; then
            echo "P5-1C acceptance failed: DOWNLOAD=$DOWNLOAD_RC CHECKSUM=$CHECKSUM_RC SOURCE=$SOURCE_RC PATCH=$PATCH_RC BUILD=$BUILD_RC OBJECT=$OBJECT_RC LINK=$LINK_RC"
            exit 1
          fi
          echo "P5-1C OCTEON build and final ELF/map/symbol checks passed."
