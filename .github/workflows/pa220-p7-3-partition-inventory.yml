name: PA-220 P7-3A bounded read-only partition inventory
on:
  push:
    branches: [feature/pa220-ubootkit-web]
    paths:
      - 'u-boot/board/octeon/pa220/pa220_partition.c'
      - 'u-boot/include/pa220_partition.h'
      - 'tests/pa220/partition-inventory/**'
      - '.github/workflows/pa220-p7-3-partition-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  host-and-target-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Host fixtures and sanitizers
        run: |
          set -euo pipefail
          mkdir -p reports/pa220/P7-3
          bash tests/pa220/partition-inventory/run.sh 2>&1 | tee reports/pa220/P7-3/10-host-tests.log
      - name: Download pinned Cavium SDK
        env:
          GH_TOKEN: ${{ secrets.OCTEON_SDK_READ_TOKEN }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/sdk"; mkdir -p "$D"
          gh release download octeon-sdk-5.1.0 --repo sdzbzyh/pa220-toolchains --pattern '*.tar.gz' --pattern '*.sha256' --dir "$D"
          (cd "$D" && sha256sum -c ./*.sha256)
          mkdir "$RUNNER_TEMP/sdk-unpack"; tar -xzf "$D"/*.tar.gz -C "$RUNNER_TEMP/sdk-unpack"
          GCC=$(find "$RUNNER_TEMP/sdk-unpack" -path '*/bin/mips64-octeon-linux-gnu-gcc' -print -quit)
          test -n "$GCC"
          "$GCC" -std=gnu99 -Wall -Wextra -Werror -Iu-boot/include -c u-boot/board/octeon/pa220/pa220_partition.c -o "$RUNNER_TEMP/pa220_partition.o"
          file "$RUNNER_TEMP/pa220_partition.o" | tee reports/pa220/P7-3/20-octeon-object.txt
          echo P7_3A_OCTEON_OBJECT=PASS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa220-p7-3a-partition-inventory-${{ github.sha }}
          path: reports/pa220/P7-3/
          if-no-files-found: warn
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state,context:"pa220/p7-3a-partition-inventory",description:"P7-3A "+process.env.JOB_STATUS,target_url:"https://github.com/"+context.repo.owner+"/"+context.repo.repo+"/actions/runs/"+context.runId});
