name: PA-220 original kernel ABI audit

on:
  push:
    branches:
      - feature/pa220-ubootkit-web
    paths:
      - .github/workflows/pa220-original-kernel-abi-audit.yml
      - scripts/pa220/audit-original-kernel-abi.sh
      - scripts/pa220/scan-oem-spi-elf.py
      - artifacts/pa220/original-kernel/pa220-original-vmlinux

permissions:
  contents: write

jobs:
  audit:
    name: Reconcile PAN-OS kernel and OEM SPI boot ABI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/pa220-ubootkit-web
          fetch-depth: 0

      - name: Install multi-architecture binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-multiarch

      - name: Audit exact uploaded kernel ELF
        shell: bash
        env:
          MIPS_OBJDUMP: objdump
          MIPS_NM: nm
        run: |
          set -euo pipefail
          scripts/pa220/audit-original-kernel-abi.sh

      - name: Scan original SPI Stage-3 executable
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:pa220-spi-normal.img > "$RUNNER_TEMP/pa220-spi-normal.img"
          python3 scripts/pa220/scan-oem-spi-elf.py "$RUNNER_TEMP/pa220-spi-normal.img" reports/pa220/P7-4/OEM-SPI-ELF-ANALYSIS.md

      - name: Upload ABI and OEM SPI evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pa220-original-kernel-and-oem-spi-abi
          path: |
            reports/pa220/P7-4/ORIGINAL-KERNEL-ABI-DISASSEMBLY.md
            reports/pa220/P7-4/OEM-SPI-ELF-ANALYSIS.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit audit reports
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pa220/P7-4/ORIGINAL-KERNEL-ABI-DISASSEMBLY.md reports/pa220/P7-4/OEM-SPI-ELF-ANALYSIS.md
          git commit -m "pa220: reconcile original kernel and OEM SPI ABI"
          git push origin HEAD:refs/heads/feature/pa220-ubootkit-web
